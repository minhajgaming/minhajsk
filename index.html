
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAMER ZONE 3D RACING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111c;color:white;font-family:Arial;text-align:center}
header{padding:12px;background:#101f34}
h1{color:#00eaff;margin:5px}
#hud{display:flex;justify-content:space-around;padding:12px;color:#00ffb3;font-weight:bold}
#game{width:100%;height:65vh;min-height:390px;position:relative;overflow:hidden;background:#182d38}
canvas{display:block;width:100%;height:100%}
#message{position:absolute;top:42%;left:0;width:100%;font-size:24px;font-weight:bold;text-shadow:0 2px 5px black;pointer-events:none}
.controls{display:flex;justify-content:center;gap:25px;padding:15px}
button{border:0;border-radius:12px;background:#00dfff;color:#00121b;font-weight:bold;font-size:20px;padding:14px 28px}
#start{font-size:17px;margin:8px}
footer{padding:15px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>🏎️ GAMER ZONE</h1>
<p>ULTIMATE 3D RACING</p>
</header>
<div id="hud">
<span>🏆 Score: <b id="score">0</b></span>
<span>⚡ Speed: <b id="speed">0</b></span>
</div>
<div id="game">
<div id="message">3D RACING</div>
</div>
<button id="start">START RACING</button>
<div class="controls">
<button id="left">⬅️ LEFT</button>
<button id="right">RIGHT ➡️</button>
</div>
<p>Use arrow keys or touch buttons to drive.</p>
<footer>© 2026 GAMER ZONE</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const area=document.getElementById("game");
const msg=document.getElementById("message");
if(!window.THREE){
 msg.innerText="Internet connection required to load 3D";
 throw new Error("Three.js failed to load");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bd7ff);
scene.fog=new THREE.Fog(0x8bd7ff,35,130);

const camera=new THREE.PerspectiveCamera(65,1,0.1,200);
camera.position.set(0,6,11);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
area.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,15,8);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color});
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(12,180),
 mat(0x333840)
);
road.rotation.x=-Math.PI/2;
road.position.z=-65;
scene.add(road);

const grass=new THREE.Mesh(
 new THREE.PlaneGeometry(160,180),
 mat(0x27833c)
);
grass.rotation.x=-Math.PI/2;
grass.position.set(0,-0.08,-65);
scene.add(grass);

const lines=[];
for(let z=10;z>-150;z-=9){
 for(let x of [-2,2]){
  let l=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,4),mat(0xffffff));
  l.position.set(x,.03,z);
  scene.add(l);lines.push(l);
 }
}

function makeCar(color){
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.35,.55,2.3),mat(color));
 body.position.y=.65;
 body.castShadow=true;
 group.add(body);
 const top=new THREE.Mesh(new THREE.BoxGeometry(.95,.55,1.15),mat(0x101d2b));
 top.position.set(0,1.12,-.15);
 group.add(top);
 const glass=new THREE.Mesh(new THREE.BoxGeometry(.83,.35,.1),mat(0x80dfff));
 glass.position.set(0,1.15,.43);
 group.add(glass);
 for(let x of [-.72,.72]){
  for(let z of [-.7,.7]){
   const w=new THREE.Mesh(new THREE.BoxGeometry(.22,.45,.4),mat(0x090909));
   w.position.set(x,.42,z);group.add(w);
  }
 }
 const light= new THREE.Mesh(new THREE.BoxGeometry(.3,.12,.06),mat(0xffffbb));
 light.position.set(-.42,.65,1.17);group.add(light);
 light.position.x=.42;
 return group;
}

const player=makeCar(0x00ccff);
player.position.set(0,0,5);
scene.add(player);

const obstacles=[];
function spawn(){
 const car=makeCar([0xff3333,0xffbb00,0xaa44ff][Math.floor(Math.random()*3)]);
 car.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-100);
 scene.add(car);obstacles.push(car);
}

const trees=[];
for(let z=10;z>-150;z-=8){
 for(let x of [-10,10]){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,1.5),mat(0x754522));
  trunk.position.set(x,.75,z);
  scene.add(trunk);
  const crown=new THREE.Mesh(new THREE.ConeGeometry(1.2,3,7),mat(0x087b35));
  crown.position.set(x,2.6,z);
  scene.add(crown);
  trees.push({trunk,crown});
 }
}

let lane=0,score=0,speed=0,playing=false,frame=0;
let last=0;

function resize(){
 const w=area.clientWidth,h=area.clientHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
window.addEventListener("resize",resize);
resize();

function move(n){
 if(playing)lane=Math.max(-1,Math.min(1,lane+n));
}
document.getElementById("left").onclick=()=>move(-1);
document.getElementById("right").onclick=()=>move(1);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
});

function end(){
 playing=false;
 msg.innerText="💥 GAME OVER! SCORE: "+score;
 document.getElementById("start").innerText="PLAY AGAIN";
}

function start(){
 obstacles.forEach(o=>scene.remove(o));
 obstacles.length=0;
 lane=0;score=0;speed=20;frame=0;
 player.position.x=0;
 playing=true;
 msg.innerText="";
 document.getElementById("start").innerText="RESTART";
 last=performance.now();
}
document.getElementById("start").onclick=start;

function animate(t){
 requestAnimationFrame(animate);
 const dt=Math.min((t-last)/1000,.05);
 last=t;

 if(playing){
  frame++;
  speed=Math.min(20+score/15,55);
  player.position.x+=(lane*4-player.position.x)*Math.min(dt*9,1);
  player.rotation.z=(player.position.x-lane*4)*-.07;

  lines.forEach(l=>{
   l.position.z+=speed*dt;
   if(l.position.z>12)l.position.z=-150;
  });

  trees.forEach(o=>{
   o.trunk.position.z+=speed*dt;
   o.crown.position.z+=speed*dt;
   if(o.trunk.position.z>12){
    o.trunk.position.z=-150;o.crown.position.z=-150;
   }
  });

  if(frame%85===0)spawn();

  for(let i=obstacles.length-1;i>=0;i--){
   let o=obstacles[i];
   o.position.z+=speed*dt;
   if(Math.abs(o.position.x-player.position.x)<1.15 &&
      Math.abs(o.position.z-player.position.z)<1.8){
    end();break;
   }
   if(o.position.z>12){
    scene.remove(o);obstacles.splice(i,1);
    score+=10;
   }
  }
  document.getElementById("score").innerText=score;
  document.getElementById("speed").innerText=Math.round(speed)+" km/h";
 }

 camera.position.x+=(player.position.x*.35-camera.position.x)*.04;
 camera.lookAt(player.position.x*.25,1,-5);
 renderer.render(scene,camera);
}
animate(0);
</script>
</body>
  </html>
